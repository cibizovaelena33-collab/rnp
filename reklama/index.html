<style>
:root{--bg:#0b1020;--card:#121933;--card2:#161c37;--line:#2a3450;--ink:#e8ecf6;--mut:#8a94b0;--neg:#fb7185;--acc:#6366f1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;
 background:radial-gradient(900px 500px at 15% -10%,rgba(99,102,241,.22),transparent 60%),radial-gradient(700px 420px at 100% 0%,rgba(45,212,191,.10),transparent 60%),var(--bg)}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:6px}
.brand svg{width:34px;height:34px}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:7px;padding:2px 7px}
.sub{color:var(--mut);font-size:13px;margin:0 0 20px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px;font-weight:600}
input[type=text],input[type=password]{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-size:15px;margin-bottom:14px;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.rem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:2px 0 18px;cursor:pointer}
.rem input{accent-color:var(--acc);width:16px;height:16px}
button{width:100%;padding:12px;border:0;border-radius:11px;background:linear-gradient(180deg,#818cf8,#4f46e5);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--neg);font-size:13px;min-height:18px;margin-top:12px;text-align:center}
.note{color:var(--mut);font-size:11.5px;margin-top:16px;text-align:center;line-height:1.5}

 const dek=await S.importKey('raw',dekRaw,'AES-GCM',false,['decrypt']);
 const pt=await S.decrypt({name:'AES-GCM',iv:u8(M.iv)},dek,u8(document.getElementById('enc').textContent.trim()));
 let html=new TextDecoder().decode(pt);
 if(remember){try{localStorage.setItem(KEYNAME,JSON.stringify({k:btoa(String.fromCharCode(...new Uint8Array(dekRaw))),kid:M.kid}));}catch(e){}}
 const out=`<script>(()=>{const n=document.querySelector('.nav');if(!n)return;const a=document.createElement('a');a.href='#';a.textContent='Выйти';a.title='Забыть вход на этом компьютере';a.style.cssText='margin-left:8px;font-size:12px;opacity:.7;padding:4px 8px';const lv=n.querySelector('.live');a.onclick=e=>{e.preventDefault();try{localStorage.removeItem('${KEYNAME}');}catch(x){}location.reload();};if(lv)lv.insertAdjacentElement('afterend',a);else n.appendChild(a);})();<\/script>`;
 html=html.replace('</body></html>',out+'</body></html>');
 // ждём, пока окно входа догрузится: иначе document.write вставит РНП ВНУТРЬ окна входа (вёрстка разъедется вбок)
 if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));
 await new Promise(r=>setTimeout(r,0));
 document.open('text/html','replace');document.write(html);document.close();
}
// запомненный вход: ключ страницы хранится только в этом браузере; сменили пароль/ключ — попросим войти заново
try{const s=JSON.parse(localStorage.getItem(KEYNAME)||'null');
 if(s&&s.kid===M.kid){openWith(u8(s.k),false).catch(()=>{try{localStorage.removeItem(KEYNAME);}catch(e){}});return;}}catch(e){}
$('u').focus();
$('f').onsubmit=async ev=>{ev.preventDefault();$('e').textContent='';$('b').disabled=true;$('b').textContent='Проверяю…';
 try{
  const login=$('u').value.trim().toLowerCase(), pwd=$('p').value, salt=u8(M.salt);
  const lid=hex(await S.digest('SHA-256',new Uint8Array([...salt,...te.encode(login)]))).slice(0,24);
  const slot=M.slots[lid]; if(!slot)throw 0;
  const base=await S.importKey('raw',te.encode(login+'\n'+pwd),'PBKDF2',false,['deriveKey']);
  const kek=await S.deriveKey({name:'PBKDF2',salt,iterations:M.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const [wiv,wct]=slot.split('.');
  const dekRaw=await S.decrypt({name:'AES-GCM',iv:u8(wiv)},kek,u8(wct));
  $('b').textContent='Открываю…';
  await openWith(dekRaw,$('r').checked);
 }catch(e){$('e').textContent='Неверный логин или пароль';$('b').disabled=false;$('b').textContent='Войти';}
};
})();
